<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mostafa Alaa — Portfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0b0c;
        --surface: #141412;
        --line: #2a2618;
        --gold: #c9a24b;
        --text: #f2eee3;
        --muted: #b3ac97;
        --font-head: "Fraunces", Georgia, serif;
        --font-body: "Inter", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 11pt;
        line-height: 1.55;
      }
      .page { padding: 28px 34px; }
      header.pdf {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 2px solid var(--gold);
        padding-bottom: 16px;
        margin-bottom: 18px;
      }
      h1 {
        font-family: var(--font-head);
        font-size: 26pt;
        margin: 0 0 4px;
        line-height: 1.1;
      }
      .role { color: var(--gold); font-weight: 600; font-size: 10.5pt; margin: 0; }
      .contact { color: var(--muted); font-size: 8.5pt; text-align: right; line-height: 1.7; }
      .contact b { color: var(--text); }
      .lead { font-size: 10.5pt; color: var(--text); max-width: 62em; margin: 0 0 14px; }
      h2 {
        font-family: var(--font-head);
        font-size: 14pt;
        margin: 20px 0 8px;
        color: var(--gold);
      }
      .kpis { display: flex; gap: 10px; margin: 10px 0 4px; }
      .kpi {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--surface);
      }
      .kpi b { display: block; font-family: var(--font-head); font-size: 15pt; color: var(--gold); }
      .kpi span { color: var(--muted); font-size: 7.5pt; }
      .cols { display: flex; gap: 24px; }
      .cols > div { flex: 1; }
      ul { margin: 4px 0 0; padding-inline-start: 18px; }
      li { margin-bottom: 3px; }
      .proj { border-top: 1.5px solid var(--gold); padding-top: 8px; margin-top: 12px; }
      .proj h3 { margin: 0 0 3px; font-size: 11pt; }
      .proj .eyebrow { color: var(--gold); font-size: 8pt; text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 2px; font-weight: 600; }
      .proj p { margin: 0 0 4px; color: var(--muted); font-size: 9.5pt; }
      .proj .pres { color: var(--text); font-weight: 600; }
      .tl div { margin-bottom: 8px; }
      .tl time { color: var(--gold); font-size: 8.5pt; font-weight: 600; display: block; }
      .tl span { font-weight: 600; font-size: 10pt; }
      .tl small { display: block; color: var(--muted); font-weight: 400; }
      .note { color: var(--muted); font-size: 8.5pt; }
      footer.pdf {
        border-top: 1px solid var(--line);
        margin-top: 18px;
        padding-top: 10px;
        color: var(--muted);
        font-size: 8.5pt;
        display: flex;
        justify-content: space-between;
      }
      @media print {
        @page { size: A4; margin: 0; }
        body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="pdf">
        <div>
          <h1>Mostafa Alaa</h1>
          <p class="role" id="pRole"></p>
        </div>
        <div class="contact">
          <b>Cairo, Egypt</b><br />
          <span id="pMail"></span><br />
          <span>wa.me/201001498032</span><br />
          <span>linkedin.com/in/mostafalaa</span>
        </div>
      </header>

      <p class="lead" id="pLead"></p>
      <div class="kpis" id="pKpis"></div>

      <div class="cols">
        <div>
          <h2 id="pSvcTitle"></h2>
          <ul id="pSvc"></ul>
          <h2 id="pTeamTitle"></h2>
          <p class="note" id="pTeamSub" style="margin: 0 0 4px"></p>
          <ul id="pTeam"></ul>
        </div>
        <div>
          <h2 id="pExpTitle"></h2>
          <div class="tl" id="pExp"></div>
        </div>
      </div>

      <h2 id="pWorkTitle"></h2>
      <div id="pProjects"></div>

      <h2 id="pMentorTitle"></h2>
      <p class="note" id="pMentorSub" style="margin: 0 0 6px"></p>

      <p class="note" id="pAboutNote" style="margin-top: 12px"></p>

      <footer class="pdf">
        <span id="pFooter"></span>
        <span>malaamos12.github.io/Portofolio/</span>
      </footer>
    </div>

    <script src="js/content/en.js"></script>
    <script>
      (function () {
        const C = window.SITE_CONTENT;
        const $ = (s) => document.querySelector(s);
        const esc = (s) =>
          String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        document.title = "Mostafa Alaa — Portfolio";
        $("#pRole").textContent = C.hero.eyebrow;
        $("#pMail").textContent = C.contact.mail;
        $("#pLead").textContent = C.about.lead;
        C.metrics.items.forEach((m) => {
          const d = document.createElement("div");
          d.className = "kpi";
          d.innerHTML =
            "<b>" + esc(m.count + m.suf) + "</b><span>" + esc(m.label) + "</span>";
          $("#pKpis").append(d);
        });
        $("#pSvcTitle").textContent = C.services.title;
        C.services.items.forEach((s) => {
          const li = document.createElement("li");
          li.innerHTML = "<b>" + esc(s.t) + ".</b> " + esc(s.d);
          $("#pSvc").append(li);
        });
        $("#pTeamTitle").textContent = C.team.title;
        $("#pTeamSub").textContent = C.team.sub;
        C.team.items.forEach((s) => {
          const li = document.createElement("li");
          li.innerHTML = "<b>" + esc(s.t) + ".</b> " + esc(s.d);
          $("#pTeam").append(li);
        });
        $("#pExpTitle").textContent = C.experience.eyebrow;
        C.experience.items.forEach((x) => {
          const d = document.createElement("div");
          d.innerHTML =
            "<time>" + esc(x.time) + "</time><span>" + esc(x.role) + "</span><small>" + esc(x.org) + "</small>";
          $("#pExp").append(d);
        });
        $("#pWorkTitle").textContent = C.work.eyebrow;
        C.projects.forEach((p) => {
          const d = document.createElement("div");
          d.className = "proj";
          d.innerHTML =
            '<p class="eyebrow">' + p.eyebrow + "</p><h3>" + esc(p.title) + "</h3><p>" +
            esc(p.plain) + "</p><p>" + esc(p.did) + '</p><p class="pres">' + esc(p.pres) + "</p>";
          $("#pProjects").append(d);
        });
        $("#pMentorTitle").textContent = C.mentor.title;
        $("#pMentorSub").textContent = C.mentor.sub;
        $("#pAboutNote").textContent = C.about.note;
        $("#pFooter").textContent = C.footer.text;
      })();
    </script>
  </body>
</html>
